<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="240" height="240" fill="#ffffff"/>
  
  <!-- Little Tail -->
  <path d="M 45 135 C 35 140, 28 152, 32 165 C 33 168, 30 172, 26 170 C 22 168, 25 162, 24 158 C 22 150, 30 135, 45 130" 
        fill="#1e293b" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Back Legs -->
  <path d="M 68 150 L 68 188 C 68 193, 84 193, 84 188 L 86 150" 
        fill="#f8fafc" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 142 150 L 142 188 C 142 193, 158 193, 158 188 L 160 148" 
        fill="#f8fafc" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Main Elephant Body -->
  <path d="M 50 120 C 45 80, 85 55, 135 60 C 175 64, 195 90, 195 120 C 195 145, 175 168, 140 168 L 70 168 C 48 168, 48 135, 50 120 Z" 
        fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Fore Legs -->
  <path d="M 88 140 L 88 195 C 88 200, 110 200, 110 195 L 110 140" 
        fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Toes -->
  <path d="M 92 195 C 92 190, 98 190, 98 195 M 99 195 C 99 190, 105 190, 105 195" 
        fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M 160 135 L 160 195 C 160 200, 182 200, 182 195 L 185 130" 
        fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Toes (Front Right) -->
  <path d="M 164 195 C 164 190, 170 190, 170 195 M 172 195 C 172 190, 178 190, 178 195" 
        fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Curved Trunk (Joyfully pointing up) -->
  <path d="M 185 100 C 198 105, 215 110, 222 95 C 228 82, 218 70, 205 75 C 196 78, 198 88, 204 88 C 210 88, 214 84, 212 90 C 208 98, 195 94, 182 85" 
        fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cute Big Floppy Ear -->
  <path d="M 152 75 C 120 70, 105 90, 110 125 C 115 152, 142 155, 155 142 C 162 135, 168 115, 165 95 C 162 82, 158 76, 152 75 Z" 
        fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Inner Ear Crease -->
  <path d="M 145 88 C 128 85, 120 100, 124 122 C 128 138, 142 140, 148 132" 
        fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Smiling Eye with Sparkle -->
  <ellipse cx="175" cy="85" rx="5" ry="6.5" fill="#1e293b"/>
  <circle cx="173.5" cy="83" r="1.8" fill="#ffffff"/>
  <!-- Happy Cheek Curve -->
  <path d="M 172 96 C 176 98, 180 97, 182 94" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Little Eyebrow -->
  <path d="M 170 76 C 174 74, 179 75, 182 78" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Water Droplets from Trunk -->
  <circle cx="218" cy="62" r="3" fill="#38bdf8"/>
  <circle cx="228" cy="72" r="2.2" fill="#38bdf8"/>
  <circle cx="208" cy="55" r="2" fill="#38bdf8"/>
</svg>

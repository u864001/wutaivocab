<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="240" height="240" fill="#ffffff"/>

  <!-- Long Curled Tail -->
  <path d="M 78 170 C 45 170, 20 150, 22 115 C 24 85, 50 78, 62 90 C 72 100, 60 115, 48 112 C 40 110, 38 98, 42 94 C 45 90, 48 92, 45 96 C 40 100, 42 105, 46 106 C 52 107, 56 98, 50 90 C 42 80, 28 88, 26 115 C 25 142, 48 162, 78 162" 
        fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Ear -->
  <circle cx="68" cy="88" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
  <circle cx="68" cy="88" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Right Ear -->
  <circle cx="172" cy="88" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
  <circle cx="172" cy="88" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Body -->
  <path d="M 85 130 C 75 145, 75 180, 85 195 C 95 205, 145 205, 155 195 C 165 180, 165 145, 155 130 Z" 
        fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Belly Patch -->
  <ellipse cx="120" cy="168" rx="22" ry="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Head Contour -->
  <circle cx="120" cy="95" r="42" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>

  <!-- Face Mask (Heart Shape) -->
  <path d="M 120 86 C 112 70, 92 70, 92 88 C 92 108, 110 118, 120 128 C 130 118, 148 108, 148 88 C 148 70, 128 70, 120 86 Z" 
        fill="#f8fafc" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Big Friendly Eyes -->
  <ellipse cx="106" cy="90" rx="5" ry="7" fill="#1e293b"/>
  <circle cx="104.5" cy="88" r="2" fill="#ffffff"/>

  <ellipse cx="134" cy="90" rx="5" ry="7" fill="#1e293b"/>
  <circle cx="132.5" cy="88" r="2" fill="#ffffff"/>

  <!-- Cute Nose (Two small dots) -->
  <circle cx="117" cy="104" r="1.5" fill="#1e293b"/>
  <circle cx="123" cy="104" r="1.5" fill="#1e293b"/>

  <!-- Big Wide Happy Smile -->
  <path d="M 108 112 C 114 120, 126 120, 132 112" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Smile Dimples -->
  <path d="M 106 112 L 105 110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 134 112 L 135 110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arms / Hands holding a Banana -->
  <path d="M 85 145 C 75 155, 80 172, 95 172" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 155 145 C 165 155, 160 172, 145 172" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- The Banana in Hand -->
  <path d="M 100 175 C 112 185, 130 182, 140 170 C 138 165, 122 172, 105 168 Z" 
        fill="#fef08a" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Feet -->
  <ellipse cx="94" cy="202" rx="14" ry="7" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
  <ellipse cx="146" cy="202" rx="14" ry="7" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
</svg>

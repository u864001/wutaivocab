<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- Triangular Roof Pediment -->
  <polygon points="100,32 30,72 170,72" fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
  <text x="100" y="62" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#1e293b">LIBRARY</text>
  <!-- Base steps -->
  <rect x="25" y="160" width="150" height="15" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
  <line x1="20" y1="175" x2="180" y2="175" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Columns -->
  <rect x="42" y="72" width="16" height="88" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
  <rect x="74" y="72" width="16" height="88" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
  <rect x="110" y="72" width="16" height="88" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
  <rect x="142" y="72" width="16" height="88" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
  <!-- Door / Book emblem in center -->
  <rect x="94" y="112" width="12" height="48" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
</svg>
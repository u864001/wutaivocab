<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia & Ben Halloween School Day - S01~S07 電影級連續樣片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cam-s01 { animation: camDollyIn 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-mia { animation: camPanMia 4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-ben { animation: camPanBen 4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-both { animation: camBoth 3.5s ease-in-out infinite alternate; }
    .cam-corridor { animation: camWalk 10s linear infinite alternate; }
    .cam-door { animation: camDoor 6s ease-in-out forwards; }
    .cam-poster { animation: camPoster 8s ease-in-out infinite alternate; }

    @keyframes camDollyIn {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.06) translate(0, -1%); }
    }
    @keyframes camPanMia {
      0% { transform: scale(1.05) translate(0, 0); }
      100% { transform: scale(1.10) translate(2.5%, -1.5%); }
    }
    @keyframes camPanBen {
      0% { transform: scale(1.05) translate(0, 0); }
      100% { transform: scale(1.10) translate(-2.5%, -1.5%); }
    }
    @keyframes camBoth {
      0% { transform: scale(1.04) translate(0, 0); }
      100% { transform: scale(1.07) translate(0, -0.8%); }
    }
    @keyframes camWalk {
      0% { transform: scale(1.04) translate(-1%, 0); }
      100% { transform: scale(1.08) translate(1.5%, -1%); }
    }
    @keyframes camDoor {
      0% { transform: scale(1.02) translate(0, 0); }
      100% { transform: scale(1.08) translate(-1%, -1%); }
    }
    @keyframes camPoster {
      0% { transform: scale(1.03) translate(0, 0); }
      100% { transform: scale(1.07) translate(0.5%, -1%); }
    }
  </style>
</head>

      'S05_L03_BEN': new Audio('/audio/halloween/S05_L03_BEN.mp3'),
      'S06_L01_MS_LIN': new Audio('/audio/halloween/S06_L01_MS_LIN.mp3'),
      'S06_L02_MIA': new Audio('/audio/halloween/S06_L02_MIA.mp3'),
      'S07_L01_MIA': new Audio('/audio/halloween/S07_L01_MIA.mp3'),
      'S07_L02_BEN': new Audio('/audio/halloween/S07_L02_BEN.mp3'),
      'S07_L03_MS_LIN': new Audio('/audio/halloween/S07_L03_MS_LIN.mp3')

    // S01~S07 完整 71 秒時間軸
    const TIMELINE = [

      { start: 31, end: 34.5, scene: 'S04: 回應問候', img: IMG_CORRIDOR, camClass: 'cam-corridor', speaker: 'BEN', en: "I'm fine. How are you?", zh: '我很好。那你呢？', audioKey: 'S04_L02_BEN' },

      { start: 66, end: 71, scene: 'S07: 發布任務', img: IMG_POSTER, camClass: 'cam-poster', speaker: 'MS_LIN', en: "Let's make a Halloween poster.", zh: '我們來製作萬聖節海報吧。', audioKey: 'S07_L03_MS_LIN' }

    let currentPlayingAudio = null;
    let isPlaying = false;
    let currentTime = 0;
    let timerId = null;

    const stageImg = document.getElementById('stageImg');
    const sceneIndicator = document.getElementById('sceneIndicator');
    const subtitleBox = document.getElementById('subtitleBox');
    const subEn = document.getElementById('subEn');
    const subZh = document.getElementById('subZh');
    const speakerTag = document.getElementById('speakerTag');
    const speakerName = document.getElementById('speakerName');
    const badgeState = document.getElementById('badgeState');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const chkEn = document.getElementById('chkEn');
    const chkZh = document.getElementById('chkZh');
    const chkBgm = document.getElementById('chkBgm');
    const audioStatusText = document.getElementById('audioStatusText');

    function applyCameraClass(cls) {
      stageImg.className = 'w-full h-full object-cover transition-transform duration-700 ease-out ' + (cls || '');
    }

    function stopAll() {
      isPlaying = false;
      if (timerId) clearInterval(timerId);
      if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        currentPlayingAudio = null;
      }
      bgmAudio.pause();
      bgmAudio.currentTime = 0;
      currentTime = 0;
      updateUI(0);
      badgeState.textContent = '待機中';
      badgeState.className = 'px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold border border-amber-400/30';
      applyCameraClass('');
      subtitleBox.style.opacity = '0';
      speakerTag.style.opacity = '0';
    }

    function playAudioDirect(key, fallbackText, label, imgKey) {
      stopAll();
      badgeState.textContent = '播放發音中';
      badgeState.className = 'px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold border border-blue-400/30 animate-pulse';

      if (imgKey === 'IMG_CORRIDOR') {
        stageImg.src = IMG_CORRIDOR;
        applyCameraClass('cam-corridor');
      } else if (imgKey === 'IMG_DOOR') {
        stageImg.src = IMG_DOOR;
        applyCameraClass('cam-door');
      } else if (imgKey === 'IMG_POSTER') {
        stageImg.src = IMG_POSTER;
        applyCameraClass('cam-poster');
      } else if (imgKey === 'IMG_MIA') {
        stageImg.src = IMG_MIA_WAVE;
        applyCameraClass('cam-mia');
      } else if (imgKey === 'IMG_BEN') {
        stageImg.src = IMG_BEN_WAVE;
        applyCameraClass('cam-ben');
      } else {
        stageImg.src = IMG_GATE_IDLE;
        applyCameraClass('cam-both');
      }

      sceneIndicator.textContent = label;
      audioStatusText.textContent = '正在播放：' + key;

      const audio = AUDIO_REGISTRY[key];
      if (audio) {
        audio.currentTime = 0;
        currentPlayingAudio = audio;
        audio.play().catch(e => console.warn(e));
        audio.onended = () => {
          badgeState.textContent = '待機中';
          audioStatusText.textContent = '發音完成';
        };
      }
    }

    function playFullSample() {
      stopAll();
      isPlaying = true;
      badgeState.textContent = '微電影放映中 (71s)';
      badgeState.className = 'px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-400/30 animate-pulse';

      if (chkBgm.checked) {
        bgmAudio.currentTime = 0;
        bgmAudio.volume = 0.12;
        bgmAudio.play().catch(() => {});
      }

      Object.values(AUDIO_REGISTRY).forEach(a => a.load());

      let lastPlayedClip = null;

      timerId = setInterval(() => {
        if (!isPlaying) return;
        currentTime += 0.1;

        if (currentTime >= 71) {
          stopAll();
          stageImg.src = IMG_POSTER;
          sceneIndicator.textContent = 'S01~S07 放映完成！';
          audioStatusText.textContent = '放映結束';
          return;
        }

        updateUI(currentTime);

        const clip = TIMELINE.find(c => currentTime >= c.start && currentTime < c.end);
        if (clip) {
          if (clip !== lastPlayedClip) {
            lastPlayedClip = clip;
            stageImg.src = clip.img;
            applyCameraClass(clip.camClass);
            sceneIndicator.textContent = clip.scene;

            if (clip.audioKey) {
              const audio = AUDIO_REGISTRY[clip.audioKey];
              if (audio) {
                if (currentPlayingAudio) {
                  currentPlayingAudio.pause();
                  currentPlayingAudio.currentTime = 0;
                }
                audio.currentTime = 0;
                currentPlayingAudio = audio;
                
                if (chkBgm.checked) bgmAudio.volume = 0.05;

                audio.play().catch(e => console.warn(e));

                audio.onended = () => {
                  if (chkBgm.checked) bgmAudio.volume = 0.12;
                };
              }
            } else {
              if (chkBgm.checked) bgmAudio.volume = 0.12;
            }

            const showEn = chkEn.checked && clip.en;
            const showZh = chkZh.checked && clip.zh;

            if (showEn || showZh) {
              subtitleBox.style.opacity = '1';
              
              if (showEn) {
                subEn.textContent = clip.en;
                subEn.classList.remove('hidden');
              } else {
                subEn.classList.add('hidden');
              }

              if (showZh) {
                subZh.textContent = clip.zh;
                subZh.classList.remove('hidden');
              } else {
                subZh.classList.add('hidden');
              }

              speakerTag.style.opacity = '1';
              speakerName.textContent = clip.speaker === 'MS_LIN' ? 'MS. LIN' : clip.speaker;
            } else {
              subtitleBox.style.opacity = '0';
              speakerTag.style.opacity = '0';
            }
          }
        } else {
          subtitleBox.style.opacity = '0';
          speakerTag.style.opacity = '0';
        }
      }, 100);
    }

    function updateUI(t) {
      const pct = (t / 71) * 100;
      progressBar.style.width = pct + '%';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      timeDisplay.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s) + ' / 01:11';
    }

    document.getElementById('btnPlayAll').onclick = playFullSample;
    document.getElementById('btnStop').onclick = stopAll;
  </script>
</body>
</html>

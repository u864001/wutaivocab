  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 多軸多鏡頭電影級運鏡 (Ken Burns / Dynamic 2.5D Camera Moves) */
    .cam-s01 { animation: camDollyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-mia { animation: camPanMia 4.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-ben { animation: camPanBen 4.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-both { animation: camBoth 4s ease-in-out infinite alternate; }
    .cam-walk { animation: camWalk 10s linear infinite alternate; }
    .cam-window { animation: camWindow 6s ease-in-out forwards; }
    .cam-door { animation: camDoor 6s ease-in-out forwards; }
    .cam-poster { animation: camPoster 8s ease-in-out infinite alternate; }
    .cam-item-focus { animation: camItemFocus 4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .cam-handoff { animation: camHandoff 4s ease-out forwards; }
    .cam-count { animation: camCount 5s ease-out forwards; }
    .cam-celebrate { animation: camCelebrate 6s ease-in-out infinite alternate; }

    @keyframes camDollyIn {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.07) translate(0, -1%); }
    }
    @keyframes camPanMia {
      0% { transform: scale(1.05) translate(0, 0); }
      100% { transform: scale(1.12) translate(2.5%, -1.2%); }
    }
    @keyframes camPanBen {
      0% { transform: scale(1.05) translate(0, 0); }
      100% { transform: scale(1.12) translate(-2.5%, -1.2%); }
    }
    @keyframes camBoth {
      0% { transform: scale(1.04) translate(0, 0); }
      100% { transform: scale(1.08) translate(0, -0.8%); }
    }
    @keyframes camWalk {
      0% { transform: scale(1.04) translate(-1.5%, 0); }
      100% { transform: scale(1.09) translate(1.5%, -1%); }
    }
    @keyframes camWindow {
      0% { transform: scale(1.03) translate(0, 0); }
      100% { transform: scale(1.08) translate(0.5%, -1%); }
    }
    @keyframes camDoor {
      0% { transform: scale(1.02) translate(0, 0); }
      100% { transform: scale(1.08) translate(-1%, -1%); }
    }
    @keyframes camPoster {
      0% { transform: scale(1.03) translate(0, 0); }
      100% { transform: scale(1.08) translate(0.5%, -1%); }
    }
    @keyframes camItemFocus {
      0% { transform: scale(1.04) translate(0, 0); }
      100% { transform: scale(1.10) translate(0, -1.5%); }
    }
    @keyframes camHandoff {
      0% { transform: scale(1.03) translate(1%, 0); }
      100% { transform: scale(1.08) translate(-1%, -0.5%); }
    }
    @keyframes camCount {
      0% { transform: scale(1.04) translate(0, 0); }
      100% { transform: scale(1.07) translate(0, -0.5%); }
    }
    @keyframes camCelebrate {
      0% { transform: scale(1.03) translate(0, 0); }
      100% { transform: scale(1.08) translate(0, -1%); }
    }
  </style>
</head>

      { start: 200, end: 203.5, section: '章節 4：海報完成與萬聖狂歡', scene: 'S18: 老師祝賀萬聖節', img: '/assets/langlab/halloween/full_frames/S18_A_treats_ready_v2.png', camClass: 'cam-celebrate', speaker: 'MS_LIN', en: "Happy Halloween!", zh: '萬聖節快樂！', audioKey: 'S18_L01_MS_LIN' },
      { start: 203.5, end: 206, section: '章節 4：海報完成與萬聖狂歡', scene: 'S18: Mia 祝賀萬聖節', img: '/assets/langlab/halloween/full_frames/S18_B_treats_received.png', camClass: 'cam-celebrate', speaker: 'MIA', en: "Happy Halloween!", zh: '萬聖節快樂！', audioKey: 'S18_L02_MIA' },
      { start: 206, end: 209, section: '章節 4：海報完成與萬聖狂歡', scene: 'S18: Ben 討糖慶祝', img: '/assets/langlab/halloween/full_frames/S18_B_treats_received.png', camClass: 'cam-celebrate', speaker: 'BEN', en: "Trick or treat!", zh: '不給糖就搗蛋！', audioKey: 'S18_L03_BEN' },
      { start: 209, end: 211.5, section: '章節 4：海報完成與萬聖狂歡', scene: 'S18: Mia 領糖致謝', img: '/assets/langlab/halloween/full_frames/S18_B_treats_received.png', camClass: 'cam-celebrate', speaker: 'MIA', en: "Thank you!", zh: '謝謝老師！', audioKey: 'S18_L04_MIA' },
      { start: 211.5, end: 214, section: '章節 4：海報完成與萬聖狂歡', scene: 'S18: 老師溫暖回禮', img: '/assets/langlab/halloween/full_frames/S18_B_treats_received.png', camClass: 'cam-celebrate', speaker: 'MS_LIN', en: "You're welcome.", zh: '不客氣。', audioKey: 'S18_L05_MS_LIN' }
    ];

    let currentPlayingAudio = null;
    let isPlaying = false;
    let currentTime = 0;
    let timerId = null;

    const stageImg = document.getElementById('stageImg');
    const sceneIndicator = document.getElementById('sceneIndicator');
    const sectionBadge = document.getElementById('sectionBadge');
    const subtitleBox = document.getElementById('subtitleBox');
    const subEn = document.getElementById('subEn');
    const subZh = document.getElementById('subZh');
    const speakerTag = document.getElementById('speakerTag');
    const speakerName = document.getElementById('speakerName');
    const badgeState = document.getElementById('badgeState');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const chkEn = document.getElementById('chkEn');
    const chkZh = document.getElementById('chkZh');
    const chkBgm = document.getElementById('chkBgm');
    const audioStatusText = document.getElementById('audioStatusText');
    const btnPlayAll = document.getElementById('btnPlayAll');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    const sceneSelect = document.getElementById('sceneSelect');
    const btnJumpScene = document.getElementById('btnJumpScene');
    const btnListeningMode = document.getElementById('btnListeningMode');
    const progressBarContainer = document.getElementById('progressBarContainer');

    function applyCameraClass(cls) {
      stageImg.className = 'w-full h-full object-cover transition-transform duration-700 ease-out ' + (cls || '');
    }

    function stopAll() {
      isPlaying = false;
      if (timerId) clearInterval(timerId);
      if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        currentPlayingAudio = null;
      }
      bgmAudio.pause();
      bgmAudio.currentTime = 0;
      currentTime = 0;
      updateUI(0);
      badgeState.textContent = '待機中';
      badgeState.className = 'px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold border border-amber-400/30';
      playIcon.textContent = '▶';
      playLabel.textContent = '播放 S01～S18 全劇微電影 (3分34秒)';
      applyCameraClass('');
      subtitleBox.style.opacity = '0';
      speakerTag.style.opacity = '0';
    }

    function playClipDirect(key, fallbackText, label, imgSrc, camClass) {
      stopAll();
      badgeState.textContent = '播放示範發音';
      badgeState.className = 'px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold border border-blue-400/30 animate-pulse';

      stageImg.src = imgSrc;
      applyCameraClass(camClass);
      sceneIndicator.textContent = label;
      audioStatusText.textContent = '正在播放：' + key;

      const audio = AUDIO_REGISTRY[key];
      if (audio) {
        audio.currentTime = 0;
        currentPlayingAudio = audio;
        audio.play().catch(e => console.warn(e));
        audio.onended = () => {
          badgeState.textContent = '待機中';
          badgeState.className = 'px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold border border-amber-400/30';
          audioStatusText.textContent = '發音完成';
        };
      }
    }

    function startPlayback(fromSecond = 0) {
      if (isPlaying && fromSecond === currentTime) {
        // 暫停
        isPlaying = false;
        if (timerId) clearInterval(timerId);
        if (currentPlayingAudio) currentPlayingAudio.pause();
        bgmAudio.pause();
        badgeState.textContent = '已暫停';
        playIcon.textContent = '▶';
        playLabel.textContent = '繼續播放';
        return;
      }

      if (timerId) clearInterval(timerId);
      if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
      }

      currentTime = fromSecond;
      isPlaying = true;
      badgeState.textContent = '放映中 (3m 34s)';
      badgeState.className = 'px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-400/30 animate-pulse';
      playIcon.textContent = '⏸';
      playLabel.textContent = '暫停微電影';

      if (chkBgm.checked) {
        bgmAudio.volume = 0.12;
        bgmAudio.play().catch(() => {});
      }

      // 預載音訊以確保流暢播放
      Object.values(AUDIO_REGISTRY).forEach(a => {
        if (a.readyState === 0) a.load();
      });

      let lastPlayedClip = null;

      timerId = setInterval(() => {
        if (!isPlaying) return;
        currentTime += 0.1;

        if (currentTime >= TOTAL_DURATION) {
          stopAll();
          stageImg.src = '/assets/langlab/halloween/full_frames/S18_B_treats_received.png';
          sceneIndicator.textContent = 'S01～S18 全劇微電影放映圓滿結束！';
          audioStatusText.textContent = '全劇放映結束';
          return;
        }

        updateUI(currentTime);

        const clip = TIMELINE.find(c => currentTime >= c.start && currentTime < c.end);
        if (clip) {
          if (clip !== lastPlayedClip) {
            lastPlayedClip = clip;
            stageImg.src = clip.img;
            applyCameraClass(clip.camClass);
            sceneIndicator.textContent = clip.scene;
            sectionBadge.textContent = clip.section;

            if (clip.audioKey) {
              const audio = AUDIO_REGISTRY[clip.audioKey];
              if (audio) {
                if (currentPlayingAudio) {
                  currentPlayingAudio.pause();
                  currentPlayingAudio.currentTime = 0;
                }
                audio.currentTime = 0;
                currentPlayingAudio = audio;
                
                // 智慧閃避：對話時將 BGM 降至 0.04
                if (chkBgm.checked) bgmAudio.volume = 0.04;

                audio.play().catch(e => console.warn(e));

                audio.onended = () => {
                  // 對話結束後 BGM 自然恢復至 0.12
                  if (chkBgm.checked) bgmAudio.volume = 0.12;
                };
              }
            } else {
              if (chkBgm.checked) bgmAudio.volume = 0.12;
            }

            // 字幕渲染 (支援獨立開關與純聽力模式)
            const showEn = chkEn.checked && clip.en;
            const showZh = chkZh.checked && clip.zh;

            if (showEn || showZh) {
              subtitleBox.style.opacity = '1';
              
              if (showEn) {
                subEn.textContent = clip.en;
                subEn.classList.remove('hidden');
              } else {
                subEn.classList.add('hidden');
              }

              if (showZh) {
                subZh.textContent = clip.zh;
                subZh.classList.remove('hidden');
              } else {
                subZh.classList.add('hidden');
              }

              speakerTag.style.opacity = '1';
              speakerName.textContent = clip.speaker === 'MS_LIN' ? 'MS. LIN (林老師)' : (clip.speaker === 'MIA' ? 'MIA' : 'BEN');
            } else {
              subtitleBox.style.opacity = '0';
              speakerTag.style.opacity = '0';
            }
          }
        } else {
          subtitleBox.style.opacity = '0';
          speakerTag.style.opacity = '0';
        }
      }, 100);
    }

    function updateUI(t) {
      const pct = (t / TOTAL_DURATION) * 100;
      progressBar.style.width = pct + '%';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      timeDisplay.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s) + ' / 03:34';
    }

    // 點擊進度條跳轉時間
    progressBarContainer.addEventListener('click', (e) => {
      const rect = progressBarContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const targetTime = ratio * TOTAL_DURATION;
      startPlayback(targetTime);
    });

    // 聽力特訓按鈕（一鍵將中英字幕全關）
    btnListeningMode.addEventListener('click', () => {
      if (chkEn.checked || chkZh.checked) {
        chkEn.checked = false;
        chkZh.checked = false;
        btnListeningMode.className = 'px-2.5 py-1 rounded-xl bg-purple-600 hover:bg-purple-500 border border-purple-400 text-white font-black active:scale-95 transition-all cursor-pointer shadow-md';
        btnListeningMode.textContent = '🎧 聽力模式 (ON)';
      } else {
        chkEn.checked = true;
        chkZh.checked = false;
        btnListeningMode.className = 'px-2.5 py-1 rounded-xl bg-purple-950/60 hover:bg-purple-900 border border-purple-500/50 text-purple-200 active:scale-95 transition-all cursor-pointer';
        btnListeningMode.textContent = '🎧 聽力特訓 (全關)';
      }
    });

    // 場景跳轉
    btnJumpScene.addEventListener('click', () => {
      const targetSec = parseFloat(sceneSelect.value);
      startPlayback(targetSec);
    });

    btnPlayAll.onclick = () => {
      if (!isPlaying) {
        startPlayback(currentTime > 0 ? currentTime : 0);
      } else {
        startPlayback(currentTime);
      }
    };

    btnStop.onclick = stopAll;
  </script>
</body>
</html>
